function updateStatus(text, type) {
  const el = $("#stt");
  if (!el) return;
  el.textContent = text;
  el.className = "";
  if (type === "sync") el.classList.add("stt-syncing");
  else if (type === "ok") el.classList.add("stt-ok");
  else if (type === "err") el.classList.add("stt-err");
}

// 클라우드 DB 저장 함수 (디바운스 적용)
let saveTimeout = null;
function save() {
  localStorage.setItem("guam_trip_v2", JSON.stringify(S));
  updateStatus("저장 중...", "sync");

  if (!docRef) {
    updateStatus("오프라인 저장됨 ✓", "ok");
    return;
  }

  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await docRef.set(S);
      updateStatus("실시간 동기화됨 ✓", "ok");
    } catch (e) {
      console.error("클라우드 저장 실패:", e);
      updateStatus("클라우드 연동 오류", "err");
    }
  }, 400);
}

function up(f) {
  if (typeof f === "function") f();
  save();
  render();
}

// Firebase 실시간 리스너 연결 (상대방이 수정 시 자동 렌더링)
function initRealtimeSync() {
  if (!docRef) {
    updateStatus("로컬 모드 (키 미설정)", "sync");
    return;
  }
  docRef.onSnapshot(doc => {
    if (doc.exists) {
      const data = doc.data();
      if (data && Array.isArray(data.days)) {
        S = data;
        localStorage.setItem("guam_trip_v2", JSON.stringify(S));
        updateStatus("실시간 동기화됨 ✓", "ok");
        render();
      }
    } else {
      // 처음 생성된 경우 기본 데이터로 초기화
      docRef.set(defaultS);
    }
  }, err => {
    console.error("실시간 동기화 오류:", err);
    updateStatus("연결 오류", "err");
  });
}

// 장소명 기반 자동 유형 태그 배지 판별 함수
function getPlaceTag(name) {
  if (!name) return "";
  const n = name.toLowerCase();
  if (n.includes("버거") || n.includes("도스") || n.includes("피카스") || n.includes("쉬림프") || 
      n.includes("bbq") || n.includes("프로아") || n.includes("크랩") || n.includes("식사") || 
      n.includes("맛집") || n.includes("카페") || n.includes("팻보이")) {
    return `<span class="tag-badge tag-food">🍽️ 식사·카페</span>`;
  }
  if (n.includes("비치") || n.includes("해변") || n.includes("절벽") || n.includes("리티디안") || 
      n.includes("이나라한") || n.includes("전망대") || n.includes("세티베이") || n.includes("메리조") || 
      n.includes("포구") || n.includes("폭포") || n.includes("스노클링") || n.includes("오카")) {
    return `<span class="tag-badge tag-sight">🏖️ 자연·관광</span>`;
  }
  if (n.includes("몰") || n.includes("아울렛") || n.includes("쇼핑") || n.includes("gpo") || 
      n.includes("마트") || n.includes("k마트") || n.includes("abc")) {
    return `<span class="tag-badge tag-shop">🛍️ 쇼핑·마트</span>`;
  }
  if (n.includes("펍") || n.includes("야시장") || n.includes("차모로") || n.includes("라이브") || n.includes("바")) {
    return `<span class="tag-badge tag-pub">🍻 펍·야시장</span>`;
  }
  if (n.includes("공항") || n.includes("호텔") || n.includes("리조트") || n.includes("플라자") || 
      n.includes("리가") || n.includes("체크인") || n.includes("체크아웃")) {
    return `<span class="tag-badge tag-stay">🏨 숙소·공항</span>`;
  }
  return `<span class="tag-badge tag-etc">📍 일정</span>`;
}

function autoFindCoords(dIdx, sIdx, val) {
  S.days[dIdx].s[sIdx].n = val;
  const clean = val.toLowerCase().replace(/[^a-z0-9가-힣]/g, "");
  for (let key in GUAM_GEO) {
    if (clean.includes(key)) {
      S.days[dIdx].s[sIdx].a = GUAM_GEO[key][0];
      S.days[dIdx].s[sIdx].o = GUAM_GEO[key][1];
      save();
      render();
      return;
    }
  }
  save();
}

function getGoogleMapsUrl(dayIndex) {
  const currentDay = S.days[dayIndex];
  if (!currentDay || !currentDay.s) return "";
  const validStops = currentDay.s.filter(s => (s.a !== "" && s.o !== "" && s.a != null) || (s.n && s.n.trim()));
  if (validStops.length < 2) return "";

  const formatStop = s => {
    if (s.a !== "" && s.o !== "" && s.a != null) return `${Number(s.a).toFixed(4)},${Number(s.o).toFixed(4)}`;
    return encodeURIComponent(s.n.trim() + " Guam");
  };

  const origin = formatStop(validStops[0]);
  const destination = formatStop(validStops[validStops.length - 1]);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
  if (validStops.length > 2) {
    url += `&waypoints=${validStops.slice(1, -1).map(formatStop).join("|")}`;
  }
  return url;
}

function zoomMap(factor) {
  mapScale = Math.min(Math.max(0.8, mapScale * factor), 6.0);
  applyMapTransform();
}
function resetMap() {
  mapScale = 1.0; mapPan = { x: 0, y: 0 };
  applyMapTransform();
}
function fitCurrentRoute() {
  const d = S.days[day];
  const P = d.s.filter(s => s.a !== "" && s.o !== "" && s.a != null);
  if (!P.length) { resetMap(); return; }

  const W = 400, H = 490, x0 = 144.58, x1 = 145.02, y0 = 13.20, y1 = 13.69;
  const pr = (o, a) => [(o - x0) / (x1 - x0) * W, (y1 - a) / (y1 - y0) * H];
  const c = P.map(p => pr(p.o, p.a));
  const xs = c.map(pt => pt[0]), ys = c.map(pt => pt[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);

  const routeW = Math.max(maxX - minX, 40), routeH = Math.max(maxY - minY, 40);
  mapScale = Math.min(Math.max(Math.min((W * 0.7) / routeW, (H * 0.7) / routeH), 1.2), 4.5);
  mapPan.x = (W / 2 - (minX + maxX) / 2) * mapScale;
  mapPan.y = (H / 2 - (minY + maxY) / 2) * mapScale;
  applyMapTransform();
}

function applyMapTransform() {
  const g = document.getElementById("mapZoomGroup");
  if (g) g.setAttribute("transform", `translate(${mapPan.x}, ${mapPan.y}) scale(${mapScale})`);
}

          <polygon points="${polyPoints}" fill="var(--cd)" stroke="var(--mu)" stroke-width="1.2" stroke-linejoin="round"/>
          ${c.length > 1 ? `<polyline points="${c.map(a => a.join(",")).join(" ")}" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="6 4"/>` : ""}
          ${c.map((a, i) => {
            const isRight = a[0] > W * 0.55;
            return `
              <circle cx="${a[0]}" cy="${a[1]}" r="11" fill="#ec4899" stroke="var(--cd)" stroke-width="2"/>
              <text x="${a[0]}" y="${a[1] + 4}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">${i + 1}</text>

    ${P.length ? `

    ${gmapsLink ? `<a class="btn" style="width:100%;margin-top:6px;" target="_blank" rel="noopener noreferrer" href="${gmapsLink}">구글맵에서 전체 경로 열기 ↗</a>` : ""}
  `;
}

// 지도 터치/마우스 제어
function attachMapEvents() {
  const container = document.getElementById("mapContainer");
  const svg = document.getElementById("interactiveSvg");
  if (!container || !svg) return;

  let isMouseDragging = false;
  let mouseStart = { x: 0, y: 0 };

  svg.addEventListener("mousedown", e => {
    isMouseDragging = true;
    mouseStart = { x: e.clientX - mapPan.x, y: e.clientY - mapPan.y };
  });

  window.addEventListener("mousemove", e => {
    if (!isMouseDragging) return;
    mapPan.x = e.clientX - mouseStart.x;
    mapPan.y = e.clientY - mouseStart.y;
    applyMapTransform();
  });

  window.addEventListener("mouseup", () => { isMouseDragging = false; });

  container.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    mapScale = Math.min(Math.max(0.8, mapScale * factor), 6.0);
    applyMapTransform();
  }, { passive: false });
}

function render() {
  $("#nav").innerHTML = TABS.map((t, i) => `
    <button class="${i === tab ? "on" : ""}" onclick="tab = ${i}; render();">${t}</button>
  `).join("");
  $("#v").innerHTML = [vSch, vBud, vChk, vRes][tab]();

  if (tab === 0) {
    attachMapEvents();
    applyMapTransform();
  }
}

function exportHtml() {
  let doc = document.documentElement.outerHTML;
  const regex = /const defaultS\s*=\s*\{[\s\S]*?\n\};/;
  const updatedS = "const defaultS = " + JSON.stringify(S, null, 2) + ";";
  doc = doc.replace(regex, updatedS);

  const blob = new Blob([doc], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
}
