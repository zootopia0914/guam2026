async function autoFindCoords(dIdx, sIdx, name) {
  if (!name || !name.trim()) return;
  const clean = name.trim().toLowerCase().replace(/[^a-z0-9가-힣]/g, "");

  for (const [k, c] of Object.entries(GUAM_GEO)) {
    if (clean.includes(k)) {
      if (S.days[dIdx]?.s[sIdx]) {
        S.days[dIdx].s[sIdx].a = c[0];
        S.days[dIdx].s[sIdx].o = c[1];
        toast(`'${name}' 좌표 등록 완료`);
        up();
        return;
      }
    }
  }

  try {
    const q = encodeURIComponent(`${name} Guam`);
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`, {
      headers: { "Accept-Language": "ko,en" }
    });
    const data = await res.json();
    if (data && data.length > 0) {
      const lat = parseFloat(parseFloat(data[0].lat).toFixed(4));
      const lon = parseFloat(parseFloat(data[0].lon).toFixed(4));
      if (S.days[dIdx]?.s[sIdx]) {
        S.days[dIdx].s[sIdx].a = lat;
        S.days[dIdx].s[sIdx].o = lon;
        toast(`'${name}' 좌표 등록: ${lat}, ${lon}`);
        up();
      }
    } else {
      toast(`'${name}' 좌표를 찾지 못했습니다.`);
    }
  } catch (e) {
    toast("좌표 검색 실패");
  }
}

function getGoogleMapsUrl(dayIndex) {
  const currentDay = S.days[dayIndex];
  if (!currentDay || !currentDay.s) return "";

  const validStops = currentDay.s.filter(s => (s.a !== "" && s.o !== "" && s.a != null) || (s.n && s.n.trim()));
  if (validStops.length < 2) return "";

  const formatStop = s => {
    if (s.a !== "" && s.o !== "" && s.a != null) return `${Number(s.a).toFixed(4)},${Number(s.o).toFixed(4)}`;
    return encodeURIComponent(s.n.trim() + " Guam");
  };

  const origin = formatStop(validStops[0]);
  const destination = formatStop(validStops[validStops.length - 1]);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;

  if (validStops.length > 2) {
    const waypoints = validStops.slice(1, -1).map(formatStop).join("|");
    url += `&waypoints=${waypoints}`;
  }
  return url;
}

function fitCurrentRoute() {
  const d = S.days[day];
  const P = d.s.filter(s => s.a !== "" && s.o !== "" && s.a != null);
  if (!P.length) {
    resetMap();
    return;
  }

  const W = 400, H = 490;
  const x0 = 144.58, x1 = 145.02, y0 = 13.20, y1 = 13.69;
  const pr = (o, a) => [(o - x0) / (x1 - x0) * W, (y1 - a) / (y1 - y0) * H];
  const c = P.map(p => pr(p.o, p.a));

  const xs = c.map(pt => pt[0]);
  const ys = c.map(pt => pt[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);

  const routeW = Math.max(maxX - minX, 40);
  const routeH = Math.max(maxY - minY, 40);

  const scaleX = (W * 0.7) / routeW;
  const scaleY = (H * 0.7) / routeH;
  mapScale = Math.min(Math.max(Math.min(scaleX, scaleY), 1.2), 4.5);

  const centerX = (minX + maxX) / 2;
  const centerY = (minY + maxY) / 2;

  mapPan.x = (W / 2 - centerX) * mapScale;
  mapPan.y = (H / 2 - centerY) * mapScale;

  applyMapTransform();
}

function applyMapTransform() {
  const g = document.getElementById("mapZoomGroup");
  if (g) {
    g.setAttribute("transform", `translate(${mapPan.x}, ${mapPan.y}) scale(${mapScale})`);
  }
}

// 괌 SVG 동선 지도 컴포넌트
function vMap() {
  const d = S.days[day];
  const P = d.s.filter(s => 
    s.a !== "" && s.o !== "" && s.a != null &&
    s.a >= 13.1 && s.a <= 13.8 && s.o >= 144.5 && s.o <= 145.1
  );

  const gmapsLink = getGoogleMapsUrl(day);

  const W = 400, H = 490;
  const x0 = 144.58, x1 = 145.02, y0 = 13.20, y1 = 13.69;
  const pr = (o, a) => [(o - x0) / (x1 - x0) * W, (y1 - a) / (y1 - y0) * H];
  
  const c = P.map(p => pr(p.o, p.a));
  const polyPoints = GU_DETAILED.map(p => pr(p[0], p[1]).map(v => v.toFixed(1)).join(",")).join(" ");

  const svg = `
    <div class="map-container" id="mapContainer">
      <div class="map-controls">
        <div class="map-btn-group">
          <button class="map-btn" onclick="fitCurrentRoute()" title="현재 일차 방문지에 맞추기">🎯 경로 맞춤</button>
          <button class="map-btn" onclick="resetMap()" title="괌 전체 보기">🔄 전체</button>
        </div>
        <div class="map-btn-group" style="justify-content: flex-end;">
          <button class="map-btn" onclick="zoomMap(1.3)" title="확대">＋</button>
          <button class="map-btn" onclick="zoomMap(0.77)" title="축소">－</button>
        </div>
      </div>

      <svg id="interactiveSvg" class="map-svg" viewBox="0 0 ${W} ${H}">
        <rect width="${W}" height="${H}" fill="var(--ln)"/>
        
        <g id="mapZoomGroup" transform="translate(${mapPan.x}, ${mapPan.y}) scale(${mapScale})" style="transform-origin: 0 0; transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);">
          <polygon points="${polyPoints}" fill="var(--cd)" stroke="var(--mu)" stroke-width="1.2" stroke-linejoin="round"/>
          
          ${c.length > 1 ? `<polyline points="${c.map(a => a.join(",")).join(" ")}" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>` : ""}
          
          ${c.map((a, i) => {
            const isRight = a[0] > W * 0.55;
            return `
              <circle cx="${a[0]}" cy="${a[1]}" r="12" fill="#ec4899" stroke="var(--cd)" stroke-width="2"/>
              <text x="${a[0]}" y="${a[1] + 4}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">${i + 1}</text>
              <text x="${a[0] + (isRight ? -16 : 16)}" y="${a[1] + 4}" text-anchor="${isRight ? "end" : "start"}" fill="var(--tx)" font-size="11" font-weight="700" paint-order="stroke" stroke="var(--cd)" stroke-width="3">${E(P[i].n)}</text>
            `;
          }).join("")}
        </g>
        
        <text x="14" y="24" fill="var(--mu)" font-size="11" font-weight="700" style="pointer-events:none;">GUAM ISLAND N ↑</text>
      </svg>
    </div>
  `;

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px;">
      <h3 style="margin:0;font-size:16px;">🗺️ 이 날의 동선 지도 (${E(d.d)})</h3>
    </div>

    ${svg}

    ${P.length === 0 ? `
      <div class="sm" style="margin-top:8px;text-align:center;padding:10px;background:var(--cd);border-radius:12px;border:1px solid var(--ln);">
        이 날은 등록된 장소가 없습니다. 일정을 추가하거나 위도/경도를 확인해주세요.
      </div>
    ` : `
      <div class="card" style="margin-top:10px;">
        <div style="font-size:13px;line-height:1.8;">
          ${P.map((p, i) => `
            <div>
              <b>${i + 1}.</b> <span class="sm">${E(p.t || "--:--")}</span> <b>${E(p.n)}</b>
              <span class="sm" style="color:var(--mu);margin-left:4px;">[${Number(p.a).toFixed(4)}, ${Number(p.o).toFixed(4)}]</span>
              ${p.m ? `<span class="sm" style="color:var(--ac);margin-left:4px;">(${E(p.m)})</span>` : ""}

    <div style="margin-top:10px;">
      ${gmapsLink ? `
        <a class="btn" style="width:100%" target="_blank" rel="noopener noreferrer" href="${gmapsLink}">
          구글맵에서 이 날 전체 경로 열기 ↗

      ` : `
        <div class="sm" style="text-align:center;color:var(--mu);margin-top:6px;">

        </div>
      `}
    </div>
  `;
}

// 2. 예산 탭
function usd(b) {
  return b.c === "USD" ? +b.a : +b.a / S.rate;
}

function vBud() {
  const T = S.bud.reduce((s, b) => s + usd(b), 0);
  const cats = {};
  S.bud.forEach(b => cats[b.k] = (cats[b.k] || 0) + usd(b));
  const f = n => Math.round(n || 0).toLocaleString();

  return `
    <div class="card">
      <div class="sm">총 예산</div>
      <div class="tot">$${f(T)} <span class="sm">≈ ${f(T * S.rate)}원</span></div>
      <div style="margin-top:6px">1인당 <b>$${f(T / (S.pax || 1))}</b> (${f((T * S.rate) / (S.pax || 1))}원)</div>
      <div class="row" style="grid-template-columns:auto 90px auto 60px;margin-top:10px">
        <span class="sm">환율 1$ =</span>
        <input type="number" value="${S.rate}" onchange="up(() => S.rate = +this.value || 1400)">
        <span class="sm">원 · 인원</span>
        <input type="number" min="1" value="${S.pax}" onchange="up(() => S.pax = +this.value || 1)">
      </div>
    </div>

    <div class="card ov">
      <table>
        ${S.bud.map((b, i) => `
          <tr>
            <td><input style="width:100%" value="${E(b.n)}" onchange="up(() => S.bud[${i}].n = this.value)"></td>
            <td><input type="number" style="width:85px" value="${b.a || ""}" placeholder="0" onchange="up(() => S.bud[${i}].a = +this.value)"></td>
            <td>
              <select onchange="up(() => S.bud[${i}].c = this.value)">
                <option ${b.c === "USD" ? "selected" : ""}>USD</option>
                <option ${b.c === "KRW" ? "selected" : ""}>KRW</option>
              </select>
            </td>
            <td><input style="width:75px" value="${E(b.k)}" onchange="up(() => S.bud[${i}].k = this.value)"></td>
            <td><button class="x" onclick="up(() => S.bud.splice(${i}, 1))">×</button></td>
          </tr>
        `).join("")}
      </table>
      <button class="btn g" style="margin-top:8px;width:100%" onclick="up(() => S.bud.push({ n: '', a: 0, c: 'USD', k: '기타' }))">+ 항목 추가</button>
    </div>

    <div class="card">
      ${Object.entries(cats).map(([k, v]) => `
        <div class="sm" style="display:flex;justify-content:space-between;margin-bottom:2px;">
          <span>${E(k)}</span>
          <span>$${f(v)}</span>
        </div>
        <div class="bar" style="margin-bottom:8px;"><i style="width:${T ? (v / T) * 100 : 0}%"></i></div>
      `).join("")}
    </div>
  `;
}

// 지도 터치/마우스 이벤트 리스너 (한 손가락은 통과, 두 손가락만 핀치/이동)
function attachMapEvents() {
  const container = document.getElementById("mapContainer");
  const svg = document.getElementById("interactiveSvg");
  if (!container || !svg) return;

  // 1. PC 마우스 제어
  let isMouseDragging = false;
  let mouseStart = { x: 0, y: 0 };

  svg.addEventListener("mousedown", e => {
    isMouseDragging = true;
    mouseStart = { x: e.clientX - mapPan.x, y: e.clientY - mapPan.y };
  });

  window.addEventListener("mousemove", e => {
    if (!isMouseDragging) return;
    mapPan.x = e.clientX - mouseStart.x;
    mapPan.y = e.clientY - mouseStart.y;
    applyMapTransform();
  });

  window.addEventListener("mouseup", () => {
    isMouseDragging = false;
  });

  // PC 마우스 휠 확대/축소
  container.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    mapScale = Math.min(Math.max(0.8, mapScale * factor), 6.0);
    applyMapTransform();
  }, { passive: false });

  // 2. 모바일 터치 제어: 1개 손가락 터치는 완전히 통과시키고 2개 이상일 때만 조작
  let initialPinchDist = null;
  let initialScale = mapScale;
  let touchStartCenter = { x: 0, y: 0 };
  let startPan = { x: 0, y: 0 };

  function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  function getTouchCenter(touches) {
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2
    };
  }

  container.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
      // 두 손가락 감지 시 브라우저 줌 방지 및 지도 제어 시작
      e.preventDefault();
      initialPinchDist = getTouchDistance(e.touches);
      initialScale = mapScale;
      touchStartCenter = getTouchCenter(e.touches);
      startPan = { ...mapPan };
    } else {
      // 한 손가락일 때는 아무 간섭 없이 브라우저 기본 세로 스크롤 허용
      initialPinchDist = null;
    }
  }, { passive: false });

  container.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && initialPinchDist) {
      e.preventDefault();
      
      // 핀치 줌 (두 손가락 거리 계산)
      const currentDist = getTouchDistance(e.touches);
      const factor = currentDist / initialPinchDist;
      mapScale = Math.min(Math.max(0.8, initialScale * factor), 6.0);

      // 두 손가락 드래그 이동
      const currentCenter = getTouchCenter(e.touches);
      mapPan.x = startPan.x + (currentCenter.x - touchStartCenter.x);
      mapPan.y = startPan.y + (currentCenter.y - touchStartCenter.y);

      applyMapTransform();
    }
    // touches.length === 1인 경우에는 preventDefault를 호출하지 않아 부드럽게 스크롤됨
  }, { passive: false });

  container.addEventListener("touchend", e => {
    if (e.touches.length < 2) {
      initialPinchDist = null;
    }
  });
}

function render() {
  $("#nav").innerHTML = TABS.map((t, i) => `
    <button class="${i === tab ? "on" : ""}" onclick="tab = ${i}; render();">${t}</button>
  `).join("");
  $("#v").innerHTML = [vSch, vBud, vChk, vRes][tab]();

  if (tab === 0) {
    attachMapEvents();
    applyMapTransform();
  }
}

// 수정한 현재 데이터를 기본값(S)으로 치환하여 새 index.html 파일 다운로드
function exportHtml() {
  let doc = document.documentElement.outerHTML;
  const regex = /const defaultS\s*=\s*\{[\s\S]*?\n\};/;
  const updatedS = "const defaultS = " + JSON.stringify(S, null, 2) + ";";
  doc = doc.replace(regex, updatedS);

  const blob = new Blob([doc], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  toast("index.html 다운로드 완료!");
}

// 안전 데이터 복구

  const L = localStorage.getItem("guam_trip_v2");
  if (L) {
    const parsed = JSON.parse(L);
    if (parsed && Array.isArray(parsed.days)) {
      S = parsed;
    }
  }
} catch (e) {}

render();
