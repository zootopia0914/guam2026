<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>혜민이와 은주의 괌 여행</title>
  <style>
    :root {
      --bg: #f4f8fc;
      --cd: #ffffff;
      --tx: #1d2f45;
      --mu: #6d8299;
      --ac: #2563eb;
      --ac-hover: #1d4ed8;
      --ln: #e0eaf3;
      --wa: #ef4444;
      --yl: #fef3c7;
      --yt: #92400e;
      --g: var(--ac);
      --sh: 0 4px 16px rgba(30, 70, 120, 0.08);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a;
        --cd: #1e293b;
        --tx: #f1f5f9;
        --mu: #94a3b8;
        --ac: #38bdf8;
        --ac-hover: #0ea5e9;
        --ln: #334155;
        --wa: #f87171;
        --yl: #3f2c06;
        --yt: #fcd34d;
        --sh: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    .w {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }
    .hero {
      padding: 6px 2px 10px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
      font-weight: 800;
    }
    .sub {
      color: var(--mu);
      font-size: 13px;
      line-height: 1.5;
    }
    #stt {
      font-size: 11px;
      color: var(--yt);
      background: var(--yl);
      border-radius: 99px;
      padding: 2px 8px;
      font-weight: 600;
      display: inline-block;
    }
    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 14px 0;
      padding: 2px;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button, .chip {
      border: 0;
      background: var(--cd);
      color: var(--tx);
      border-radius: 999px;
      padding: 8px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--sh);
      transition: background 0.15s, color 0.15s;
    }
    nav button.on, .chip.on {
      background: var(--ac);
      color: #fff;
    }
    .card {
      background: var(--cd);
      border: 1px solid var(--ln);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--sh);
    }
    input, select {
      font: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 0;
    }
    input:focus, select:focus {
      outline: 2px solid var(--ac);
      background: var(--cd);
    }
    .row {
      display: grid;
      gap: 6px;
      align-items: center;
    }
    .st {
      grid-template-columns: 75px 1fr 30px;
    }
    .sm {
      font-size: 12px;
      color: var(--mu);
    }
    .x {
      border: 0;
      background: none;
      color: var(--mu);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
    }
    .x:hover { color: var(--wa); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: var(--ac);
      color: #fff;
      border-radius: 999px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
