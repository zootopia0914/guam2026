// [정렬 기능] 시간순 자동 오름차순 정렬
function sortByTime(dayIdx) {
  if (!S.days[dayIdx] || !S.days[dayIdx].s) return;
  S.days[dayIdx].s.sort((a, b) => {
    const timeA = (a.t || "").replace(/[^0-9]/g, "").padEnd(4, "0");
    const timeB = (b.t || "").replace(/[^0-9]/g, "").padEnd(4, "0");
    if (!a.t) return 1;
    if (!b.t) return -1;
    return timeA.localeCompare(timeB);
  });
}

// [위치검색 기능] 1차 내부 사전 매핑 → 2차 온라인 지오코딩 검색 → 없으면 alert 알림
async function autoFindCoords(dIdx, sIdx, name, rowEl, showAlert = true) {
  if (!name || !name.trim()) return;
  const raw = name.trim();
  const clean = raw.toLowerCase().replace(/[^a-z0-9가-힣]/g, "");

  // 1차: 사전 매칭
  for (const [k, c] of Object.entries(GUAM_GEO)) {
    if (clean.includes(k)) {
      applyCoords(dIdx, sIdx, c[0], c[1], rowEl);
      return;
    }
  }

  // 2차: 온라인 지오코딩 조회 (Guam 영역)
  updateStatus("좌표 검색 중...", "sync");
  try {
    const q = encodeURIComponent(raw + " Guam");
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&viewbox=144.55,13.70,145.05,13.20&bounded=0`);
    const data = await res.json();
    if (data && data.length > 0) {
      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);
      if (lat >= 13.1 && lat <= 13.8 && lon >= 144.5 && lon <= 145.1) {
        applyCoords(dIdx, sIdx, lat, lon, rowEl);
        updateStatus("실시간 동기화됨 ✓", "ok");
        return;
      }
    }
  } catch (err) {
    console.error("지오코딩 조회 에러:", err);
  }

  // 실패 시 알림창 노출
  updateStatus("실시간 동기화됨 ✓", "ok");
  if (showAlert) {
    alert(`‘${raw}’의 괌 내 위치 좌표를 찾을 수 없습니다.\n위도와 경도를 직접 입력해 주세요.`);
  }
}

function applyCoords(dIdx, sIdx, lat, lon, rowEl) {
  if (S.days[dIdx] && S.days[dIdx].s[sIdx]) {
    S.days[dIdx].s[sIdx].a = lat;
    S.days[dIdx].s[sIdx].o = lon;

    if (rowEl) {
      const latInput = rowEl.querySelector(".coord-lat");
      const lngInput = rowEl.querySelector(".coord-lng");
      if (latInput) latInput.value = Number(lat).toFixed(4);
      if (lngInput) lngInput.value = Number(lon).toFixed(4);
    }
    save();
  }
}

// 클라우드 저장
let saveTimer = null;
function save() {
  localStorage.setItem("guam_trip_cloud_v1", JSON.stringify(S));
  updateStatus("저장 중...", "sync");

  if (!docRef) {
    updateStatus("로컬 저장됨 ✓", "ok");
    return;
  }

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await docRef.set(S);
      updateStatus("실시간 동기화됨 ✓", "ok");
    } catch (e) {
      console.error("클라우드 저장 에러:", e);
      updateStatus("동기화 오류", "err");
    }
  }, 400);
}

function up(f) {
  if (typeof f === "function") f();
  save();
  render();
}

// Firebase 리스너 연결
function initRealtimeSync() {
  if (!docRef) return;
  docRef.onSnapshot(doc => {
    if (doc.exists) {
      const data = doc.data();
      if (data && Array.isArray(data.days) && data.days.length > 0) {
        S = data;
        if (!S.personal) S.personal = [];
        localStorage.setItem("guam_trip_cloud_v1", JSON.stringify(S));
        updateStatus("실시간 동기화됨 ✓", "ok");
        render();
      }
    } else {
      docRef.set(defaultS);
    }
  }, err => {
    console.error("동기화 연결 오류:", err);
    updateStatus("연결 오류", "err");
  });
}

function getCategoryBadge(name) {
  const n = (name || "").toLowerCase().replace(/\s+/g, "");
  if (/버거|카페|쉬림프|크랩|피카스|팻보이|칠리스|스테이크|크레페|퍼플|바비큐|브런치|식사|점심|저녁/.test(n)) {
    return `<span class="cat-badge cat-food">🍽️ 맛집/카페</span>`;
  }
  if (/비치|전망대|세티|메리조|이나라한|수영장|포인트|절벽|오카|투몬비치/.test(n)) {
    return `<span class="cat-badge cat-spot">🏖️ 자연/관광</span>`;
  }
  if (/아울렛|gpo|마트|abc|쇼핑|몰/.test(n)) {
    return `<span class="cat-badge cat-shop">🛍️ 쇼핑/마트</span>`;
  }
  if (/야시장|라이브|하우스|펍|맥주/.test(n)) {
    return `<span class="cat-badge cat-night">🍻 나이트/펍</span>`;
  }
  if (/호텔|리조트|플라자|리가로얄|rihga|공항/.test(n)) {
    return `<span class="cat-badge cat-hotel">🏨 숙소/공항</span>`;
  }
  return `<span class="cat-badge cat-spot">📍 스폿</span>`;
}

function getSingleGoogleMapsUrl(stop) {
  if (stop.a !== "" && stop.o !== "" && stop.a != null) {
    return `https://www.google.com/maps/search/?api=1&query=${Number(stop.a).toFixed(4)},${Number(stop.o).toFixed(4)}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.n + " Guam")}`;
}

function getGoogleMapsUrl(dayIndex) {
  const currentDay = S.days[dayIndex];
  if (!currentDay || !currentDay.s) return "";
  const validStops = currentDay.s.filter(s => (s.a !== "" && s.o !== "" && s.a != null) || (s.n && s.n.trim()));
  if (validStops.length < 2) return "";

  const formatStop = s => {
    if (s.a !== "" && s.o !== "" && s.a != null) return `${Number(s.a).toFixed(4)},${Number(s.o).toFixed(4)}`;
    return encodeURIComponent(s.n.trim() + " Guam");
  };

  const origin = formatStop(validStops[0]);
  const destination = formatStop(validStops[validStops.length - 1]);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
  if (validStops.length > 2) {
    url += `&waypoints=${validStops.slice(1, -1).map(formatStop).join("|")}`;
  }
  return url;
}

function pr(o, a) {
  const W = 400, H = 490;
  const x0 = 144.58, x1 = 145.02, y0 = 13.20, y1 = 13.69;
  return [(o - x0) / (x1 - x0) * W, (y1 - a) / (y1 - y0) * H];
}

function updateSvgViewBox() {
  const svg = document.getElementById("interactiveSvg");
  if (svg) svg.setAttribute("viewBox", `${currentVB.x} ${currentVB.y} ${currentVB.w} ${currentVB.h}`);
}

function fitCurrentRoute() {
  const d = S.days[day];
  if (!d || !d.s) return;
  const P = d.s.filter(s => s.a !== "" && s.o !== "" && s.a != null);
  if (!P.length) { resetMap(); return; }

  const c = P.map(p => pr(p.o, p.a));
  const xs = c.map(pt => pt[0]), ys = c.map(pt => pt[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);

  let bw = Math.max(maxX - minX, 60) + 90;
  let bh = Math.max(maxY - minY, 60) + 90;
  const targetRatio = 400 / 490;
  let finalW = bw / bh > targetRatio ? bw : bh * targetRatio;
  let finalH = bw / bh > targetRatio ? bw / targetRatio : bh;

  finalW = Math.min(finalW, 400);
  finalH = Math.min(finalH, 490);

  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  currentVB = {
    x: Math.max(0, Math.min(cx - finalW / 2, 400 - finalW)),
    y: Math.max(0, Math.min(cy - finalH / 2, 490 - finalH)),
    w: finalW,
    h: finalH
  };
  updateSvgViewBox();
}

function resetMap() {
  currentVB = { ...BASE_VB };
  updateSvgViewBox();
}

function zoomMap(factor) {
  const cx = currentVB.x + currentVB.w / 2;
  const cy = currentVB.y + currentVB.h / 2;
  const newW = Math.max(50, Math.min(400, currentVB.w / factor));
  const newH = Math.max(60, Math.min(490, currentVB.h / factor));
  currentVB = {
    x: Math.max(0, Math.min(cx - newW / 2, 400 - newW)),
    y: Math.max(0, Math.min(cy - newH / 2, 490 - newH)),
    w: newW,
    h: newH
  };
  updateSvgViewBox();
}

function vMap() {
  const d = S.days[day];
  if (!d || !d.s) return "";
  const P = d.s.filter(s => s.a !== "" && s.o !== "" && s.a != null && s.a >= 13.1 && s.a <= 13.8 && s.o >= 144.5 && s.o <= 145.1);
  const gmapsLink = getGoogleMapsUrl(day);
  const W = 400, H = 490;
  const c = P.map(p => pr(p.o, p.a));
  const polyPoints = GU_DETAILED.map(p => pr(p[0], p[1]).map(v => v.toFixed(1)).join(",")).join(" ");

  const offsets = [
    { dx: 14, dy: -6, anchor: "start" },
    { dx: -14, dy: -6, anchor: "end" },
    { dx: 14, dy: 10, anchor: "start" },
    { dx: -14, dy: 10, anchor: "end" },

  return `

          <button class="map-btn" onclick="resetMap()" title="괌 전체 보기">🔄 전체</button>
        </div>
        <div class="map-btn-group" style="justify-content: flex-end;">
          <button class="map-btn" onclick="zoomMap(1.3)" title="확대">＋</button>
          <button class="map-btn" onclick="zoomMap(0.77)" title="축소">－</button>
        </div>
      </div>

      <svg id="interactiveSvg" class="map-svg" viewBox="${currentVB.x} ${currentVB.y} ${currentVB.w} ${currentVB.h}">
        <rect width="${W}" height="${H}" fill="var(--ln)"/>
        <polygon points="${polyPoints}" fill="var(--cd)" stroke="var(--mu)" stroke-width="1.0" stroke-linejoin="round"/>
        ${c.length > 1 ? `<polyline points="${c.map(a => a.join(",")).join(" ")}" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>` : ""}
        ${c.map((a, i) => {
          const off = offsets[i % offsets.length];
          const tx = a[0] + off.dx;
          const ty = a[1] + off.dy;
          return `
            <line x1="${a[0]}" y1="${a[1]}" x2="${tx}" y2="${ty}" stroke="#ec4899" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.65"/>

            <text x="${tx}" y="${ty + 3}" text-anchor="${off.anchor}" fill="var(--tx)" font-size="8.5" font-weight="700" paint-order="stroke" stroke="var(--cd)" stroke-width="2.5" stroke-linejoin="round">

              <td><input type="number" style="width:75px" value="${p.a || ''}" placeholder="0" onchange="up(() => S.personal[${i}].a = +this.value)"></td>
              <td>
                <select onchange="up(() => S.personal[${i}].c = this.value)">
                  <option ${p.c === 'USD' ? 'selected' : ''}>USD</option>
                  <option ${p.c === 'KRW' ? 'selected' : ''}>KRW</option>
                </select>
              </td>
              <td>
                <select style="color:${p.st === 'Y' ? '#10b981' : '#f59e0b'};font-weight:700;" onchange="up(() => S.personal[${i}].st = this.value)">
                  <option value="Y" ${p.st === 'Y' ? 'selected' : ''}>완료</option>
                  <option value="N" ${p.st !== 'Y' ? 'selected' : ''}>미정산</option>
                </select>
              </td>
              <td><button class="x" onclick="up(() => S.personal.splice(${i}, 1))">×</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <button class="btn g" style="margin-top:8px;width:100%;padding:7px;" onclick="up(() => S.personal.push({ who: '혜민', n: '', a: 0, c: 'USD', st: 'N' }))">
        + 개인 지출 추가
      </button>
    </div>
  `;
}

// 3. 준비물 탭
function vChk() {
  let a = 0, n = 0;
  (S.chk || []).forEach(g => (g.i || []).forEach(i => { n++; a += i[1]; }));

  return `
    <div class="card">
      <b>준비 진행률 ${a}/${n}</b>
      <div class="bar" style="margin-top:5px;"><i style="width:${n ? (a / n) * 100 : 0}%"></i></div>
    </div>

    ${(S.chk || []).map((g, gi) => `
      <div class="card">
        <b>${E(g.g)}</b>
        ${(g.i || []).map((it, ii) => `
          <div style="display:flex;gap:7px;align-items:center;padding:4px 0;">
            <input type="checkbox" ${it[1] ? "checked" : ""} onchange="up(() => S.chk[${gi}].i[${ii}][1] = this.checked ? 1 : 0)">
            <span style="flex:1;${it[1] ? "text-decoration:line-through;color:var(--mu)" : ""}">${E(it[0])}</span>
            <button class="x" onclick="up(() => S.chk[${gi}].i.splice(${ii}, 1))">×</button>
          </div>
        `).join("")}
        <input placeholder="+ 새 준비물 입력 후 Enter" style="width:100%;margin-top:5px" 
          onkeydown="if(event.key === 'Enter' && this.value.trim()){ const val = this.value.trim(); up(() => S.chk[${gi}].i.push([val, 0])); this.value = ''; }">
      </div>
    `).join("")}
  `;
}

// 4. 예약 탭
function vRes() {
  return `
    <div class="card ov">
      <table>
        ${(S.res || []).map((r, i) => `
          <tr>
            <td colspan="2" style="border-bottom:1px solid var(--ln);padding:7px 0;">
              <div class="row" style="grid-template-columns:70px 1fr 1fr 26px">
                <input value="${E(r.k)}" onchange="up(() => S.res[${i}].k = this.value)">
                <input value="${E(r.n)}" placeholder="이름·구간" onchange="up(() => S.res[${i}].n = this.value)">
                <input value="${E(r.w)}" placeholder="날짜·시간" onchange="up(() => S.res[${i}].w = this.value)">
                <button class="x" onclick="up(() => S.res.splice(${i}, 1))">×</button>
              </div>
              <div class="row" style="grid-template-columns:1fr 1fr;margin-top:4px">
                <input value="${E(r.no)}" placeholder="확인번호" onchange="up(() => S.res[${i}].no = this.value)">
                <input value="${E(r.m)}" placeholder="메모" onchange="up(() => S.res[${i}].m = this.value)">
              </div>
            </td>
          </tr>
        `).join("")}
      </table>
      <button class="btn g" style="margin-top:8px;width:100%;padding:8px;" onclick="up(() => S.res.push({ k: '', n: '', w: '', no: '', m: '' }))">+ 예약 항목 추가</button>
    </div>
  `;
}

function attachMapEvents() {
  const container = document.getElementById("mapContainer");
  const svg = document.getElementById("interactiveSvg");
  if (!container || !svg) return;

  let isMouseDragging = false;
  let mouseStart = { x: 0, y: 0 };
  let startVB = { ...currentVB };

  svg.addEventListener("mousedown", e => {
    isMouseDragging = true;
    mouseStart = { x: e.clientX, y: e.clientY };
    startVB = { ...currentVB };
  });

  window.addEventListener("mousemove", e => {
    if (!isMouseDragging) return;
    const rect = svg.getBoundingClientRect();
    const factorX = currentVB.w / rect.width;
    const factorY = currentVB.h / rect.height;
    const dx = (e.clientX - mouseStart.x) * factorX;
    const dy = (e.clientY - mouseStart.y) * factorY;
    currentVB.x = Math.max(0, Math.min(startVB.x - dx, 400 - currentVB.w));
    currentVB.y = Math.max(0, Math.min(startVB.y - dy, 490 - currentVB.h));
    updateSvgViewBox();
  });

  window.addEventListener("mouseup", () => { isMouseDragging = false; });
  container.addEventListener("wheel", e => {
    e.preventDefault();
    zoomMap(e.deltaY < 0 ? 1.15 : 0.85);
  }, { passive: false });
}

function switchDay(idx) {
  day = idx;
  fitCurrentRoute();
  render();
}

function render() {
  $("#nav").innerHTML = TABS.map((t, i) => `
    <button class="${i === tab ? "on" : ""}" onclick="tab = ${i}; render();">${t}</button>
  `).join("");

  const subTabs = $("#subTabs");
  if (tab === 0) {
    subTabs.style.display = "flex";
    subTabs.innerHTML = S.days.map((d, i) => `
      <button class="chip ${i === day ? "on" : ""}" onclick="switchDay(${i})">${E(d.d)}</button>
    `).join("");
  } else {
    subTabs.style.display = "none";
  }

  $("#v").innerHTML = [vSch, vBud, vChk, vRes][tab]();

  if (tab === 0) {
    attachMapEvents();
  }
}

// 1. 기존 로컬 캐시 확인
try {
  const L = localStorage.getItem("guam_trip_cloud_v1");
  if (L) {
    const parsed = JSON.parse(L);
    if (parsed && Array.isArray(parsed.days)) {
      S = parsed;
      if (!S.personal) S.personal = [];
    }
  }
} catch (e) {}

// 2. 초기 렌더 및 클라우드 실시간 동기화 시작
fitCurrentRoute();
render();
initRealtimeSync();
</script>
