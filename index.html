function updateStatus(text, type) {
  const el = document.getElementById("stt");
  if (!el) return;
  el.textContent = text;
  el.className = "";
  if (type === "sync") el.classList.add("stt-sync");
  else if (type === "ok") el.classList.add("stt-ok");
  else if (type === "err") el.classList.add("stt-err");
}

// D-Day 계산
function updateDday() {
  const badge = document.getElementById("ddayBadge");
  if (!badge) return;
  const targetYear = new Date().getFullYear();
  let target = new Date(targetYear, 11, 5); // 12월 5일
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  
  if (today > new Date(targetYear, 11, 10)) {
    target = new Date(targetYear + 1, 11, 5);
  }
  
  const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
  if (diff > 0) badge.textContent = `D-${diff}`;
  else if (diff === 0) badge.textContent = `D-DAY 🎉`;
  else badge.textContent = `여행 중 🌴`;
}

function sortByTime(dayIdx) {
  if (!S.days[dayIdx] || !S.days[dayIdx].s) return;
  S.days[dayIdx].s.sort((a, b) => {
    const timeA = (a.t || "").replace(/[^0-9]/g, "").padEnd(4, "0");
    const timeB = (b.t || "").replace(/[^0-9]/g, "").padEnd(4, "0");
    if (!a.t) return 1;
    if (!b.t) return -1;
    return timeA.localeCompare(timeB);
  });
}

// [위치검색 기능]
async function autoFindCoords(dIdx, sIdx, name, rowEl, showAlert = true) {
  if (!name || !name.trim()) return;
  const raw = name.trim();
  const clean = raw.toLowerCase().replace(/[^a-z0-9가-힣]/g, "");

  for (const [k, c] of Object.entries(GUAM_GEO)) {
    if (clean.includes(k)) {
      applyCoords(dIdx, sIdx, c[0], c[1], rowEl);
      return;
    }
  }

  updateStatus("좌표 검색 중...", "sync");
  try {
    const q = encodeURIComponent(raw + " Guam");
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&viewbox=144.55,13.70,145.05,13.20&bounded=0`);
    const data = await res.json();
    if (data && data.length > 0) {
      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);
      if (lat >= 13.1 && lat <= 13.8 && lon >= 144.5 && lon <= 145.1) {
        applyCoords(dIdx, sIdx, lat, lon, rowEl);
        updateStatus("실시간 동기화됨 ✓", "ok");
        return;
      }
    }
  } catch (err) {
    console.error("지오코딩 에러:", err);
  }

  updateStatus("실시간 동기화됨 ✓", "ok");
  if (showAlert) {
    alert(`‘${raw}’의 괌 내 위치 좌표를 찾을 수 없습니다.\n위도와 경도를 직접 입력해 주세요.`);
  }
}

function applyCoords(dIdx, sIdx, lat, lon, rowEl) {
  if (S.days[dIdx] && S.days[dIdx].s[sIdx]) {
    S.days[dIdx].s[sIdx].a = lat;
    S.days[dIdx].s[sIdx].o = lon;

    if (rowEl) {
      const latInput = rowEl.querySelector(".coord-lat");
      const lngInput = rowEl.querySelector(".coord-lng");
      if (latInput) latInput.value = Number(lat).toFixed(4);
      if (lngInput) lngInput.value = Number(lon).toFixed(4);
    }
    save();
  }
}

// [이미지 초경량 리사이징]
function resizeImage(file, callback) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const maxW = 320;
      let w = img.width;
      let h = img.height;
      if (w > maxW) {
        h = Math.round((h * maxW) / w);
        w = maxW;
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.55);
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function initRealtimeSync() {
  if (!docRef) return;
  docRef.onSnapshot(doc => {
    if (doc.exists) {
      const data = doc.data();
      if (data && Array.isArray(data.days) && data.days.length > 0) {
        S = data;
        if (!S.personal) S.personal = [];
        if (!S.outfits) S.outfits = defaultS.outfits;
        if (!S.chk) S.chk = [];
        localStorage.setItem("guam_trip_cloud_v1", JSON.stringify(S));
        updateStatus("실시간 동기화됨 ✓", "ok");
        render();
      }
    } else {
      docRef.set(defaultS);
    }
  }, err => {
    console.error("동기화 에러:", err);
    updateStatus("연결 오류", "err");
  });
}

function getSingleGoogleMapsUrl(stop) {
  if (stop.a !== "" && stop.o !== "" && stop.a != null) {
    return `https://www.google.com/maps/search/?api=1&query=${Number(stop.a).toFixed(4)},${Number(stop.o).toFixed(4)}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.n + " Guam")}`;
}

function getGoogleMapsUrl(dayIndex) {
  const currentDay = S.days[dayIndex];
  if (!currentDay || !currentDay.s) return "";
  const validStops = currentDay.s.filter(s => (s.a !== "" && s.o !== "" && s.a != null) || (s.n && s.n.trim()));
  if (validStops.length < 2) return "";

  const formatStop = s => {
    if (s.a !== "" && s.o !== "" && s.a != null) return `${Number(s.a).toFixed(4)},${Number(s.o).toFixed(4)}`;
    return encodeURIComponent(s.n.trim() + " Guam");
  };

  const origin = formatStop(validStops[0]);
  const destination = formatStop(validStops[validStops.length - 1]);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
  if (validStops.length > 2) {
    url += `&waypoints=${validStops.slice(1, -1).map(formatStop).join("|")}`;
  }
  return url;
}

function pr(o, a) {
  const W = 400, H = 490;
  const x0 = 144.58, x1 = 145.02, y0 = 13.20, y1 = 13.69;
  return [(o - x0) / (x1 - x0) * W, (y1 - a) / (y1 - y0) * H];
}

function updateSvgViewBox() {
  const svg = document.getElementById("interactiveSvg");
  if (svg) svg.setAttribute("viewBox", `${currentVB.x} ${currentVB.y} ${currentVB.w} ${currentVB.h}`);
}

function fitCurrentRoute() {
  const d = S.days[day];
  if (!d || !d.s) return;
  const P = d.s.filter(s => s.a !== "" && s.o !== "" && s.a != null);
  if (!P.length) { resetMap(); return; }

  const c = P.map(p => pr(p.o, p.a));
  const xs = c.map(pt => pt[0]), ys = c.map(pt => pt[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);

  let bw = Math.max(maxX - minX, 60) + 90;
  let bh = Math.max(maxY - minY, 60) + 90;
  const targetRatio = 400 / 490;
  let finalW = bw / bh > targetRatio ? bw : bh * targetRatio;
  let finalH = bw / bh > targetRatio ? bw / targetRatio : bh;

  finalW = Math.min(finalW, 400);
  finalH = Math.min(finalH, 490);

  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  currentVB = {
    x: Math.max(0, Math.min(cx - finalW / 2, 400 - finalW)),
    y: Math.max(0, Math.min(cy - finalH / 2, 490 - finalH)),
    w: finalW,
    h: finalH
  };
  updateSvgViewBox();
}

function resetMap() {
  currentVB = { ...BASE_VB };
  updateSvgViewBox();
}

function zoomMap(factor) {
  const cx = currentVB.x + currentVB.w / 2;
  const cy = currentVB.y + currentVB.h / 2;
  const newW = Math.max(50, Math.min(400, currentVB.w / factor));
  const newH = Math.max(60, Math.min(490, currentVB.h / factor));
  currentVB = {
    x: Math.max(0, Math.min(cx - newW / 2, 400 - newW)),
    y: Math.max(0, Math.min(cy - newH / 2, 490 - newH)),
    w: newW,
    h: newH
  };
  updateSvgViewBox();
}

// 2. 예산 탭

function usd(b) {
  return b.c === "USD" ? +b.a : +b.a / (S.rate || 1400);
}

// 실시간 환율 계산기 동작
function calcLiveRate(val) {
  const resEl = document.getElementById("liveCalcRes");
  if (!resEl) return;
  const num = parseFloat(val) || 0;
  const rate = S.rate || 1400;
  resEl.textContent = Math.round(num * rate).toLocaleString();
}

function vBud() {
  if (!S.personal) S.personal = [];
  
  const sharedList = S.bud || [];
  const personalList = S.personal || [];
  const rate = S.rate || 1400;
  const f = n => Math.round(n || 0).toLocaleString();

  // 1. 공용 경비 계산 (1/N 나눔 대상)
  const sharedTotal = sharedList.reduce((s, b) => s + usd(b), 0);
  const sharedSettled = sharedList.filter(b => b.st === "Y").reduce((s, b) => s + usd(b), 0);
  const sharedUnsettled = sharedTotal - sharedSettled;
  const sharedPerPerson = sharedTotal / 2;

  // 2. 결제 수단별 집계 (전체)
  const allItems = [...sharedList, ...personalList];
  const prepayTotal = allItems.filter(b => (b.pay || "선결제") === "선결제").reduce((s, b) => s + usd(b), 0);
  const cashTotal   = allItems.filter(b => b.pay === "현금").reduce((s, b) => s + usd(b), 0);
  const cardTotal   = allItems.filter(b => b.pay === "카드").reduce((s, b) => s + usd(b), 0);

  // 3. 개인별 지출
  const hyeminTotal = personalList.filter(p => (p.who || "혜민") === "혜민").reduce((s, b) => s + usd(b), 0);
  const eunjuTotal = personalList.filter(p => p.who === "은주").reduce((s, b) => s + usd(b), 0);

  // 4. 정산 게이지 (공용 경비 기준)
  const grandPct = sharedTotal > 0 ? (sharedSettled / sharedTotal) * 100 : 0;

  // 공용 카테고리별 비중

  return `
    <div class="card">
      <b>준비 진행률 ${a}/${n}</b>
      <div class="bar" style="margin-top:5px;"><i style="width:${n ? (a / n) * 100 : 0}%"></i></div>
    </div>

    ${(S.chk || []).length === 0 ? `
      <div class="card" style="text-align:center;padding:24px 12px;color:var(--mu);">
        등록된 준비물 그룹이 없습니다.<br>
        <button class="btn sm-btn g" style="margin-top:10px;" onclick="up(() => S.chk.push({ g: '필수 준비물', i: [] }))">+ 첫 준비물 그룹 만들기</button>
      </div>
    ` : ''}

    ${(S.chk || []).map((g, gi) => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <input value="${E(g.g)}" style="font-weight:700;font-size:14px;border:0;padding:2px 4px;background:none;" onchange="up(() => S.chk[${gi}].g = this.value)">
          <button class="x" style="font-size:14px;" onclick="up(() => S.chk.splice(${gi}, 1))">그룹 삭제</button>
        </div>
        ${(g.i || []).map((it, ii) => `
          <div style="display:flex;gap:7px;align-items:center;padding:4px 0;">
            <input type="checkbox" ${it[1] ? "checked" : ""} onchange="up(() => S.chk[${gi}].i[${ii}][1] = this.checked ? 1 : 0)">
            <span style="flex:1;${it[1] ? "text-decoration:line-through;color:var(--mu)" : ""}">${E(it[0])}</span>

function attachMapEvents() {
  const container = document.getElementById("mapContainer");
  const svg = document.getElementById("interactiveSvg");
  if (!container || !svg) return;

  let isMouseDragging = false;
  let mouseStart = { x: 0, y: 0 };
  let startVB = { ...currentVB };

  svg.addEventListener("mousedown", e => {
    isMouseDragging = true;
    mouseStart = { x: e.clientX, y: e.clientY };
    startVB = { ...currentVB };
  });

  window.addEventListener("mousemove", e => {
    if (!isMouseDragging) return;
    const rect = svg.getBoundingClientRect();
    const factorX = currentVB.w / rect.width;
    const factorY = currentVB.h / rect.height;
    const dx = (e.clientX - mouseStart.x) * factorX;
    const dy = (e.clientY - mouseStart.y) * factorY;
    currentVB.x = Math.max(0, Math.min(startVB.x - dx, 400 - currentVB.w));
    currentVB.y = Math.max(0, Math.min(startVB.y - dy, 490 - currentVB.h));
    updateSvgViewBox();
  });

  window.addEventListener("mouseup", () => { isMouseDragging = false; });
  container.addEventListener("wheel", e => {
    e.preventDefault();
    zoomMap(e.deltaY < 0 ? 1.15 : 0.85);
  }, { passive: false });
}

function switchDay(idx) {
  day = idx;
  if (tab === 0) fitCurrentRoute();
  render();
}

function render() {
  updateDday();
  $("#nav").innerHTML = TABS.map((t, i) => `
    <button class="${i === tab ? "on" : ""}" onclick="tab = ${i}; render();">${t}</button>
  `).join("");

  const subTabs = $("#subTabs");
  if (tab === 0 || tab === 4) {
    subTabs.style.display = "flex";
    subTabs.innerHTML = S.days.map((d, i) => `
      <button class="chip ${i === day ? "on" : ""}" onclick="switchDay(${i})">${E(d.d)}</button>
    `).join("");
  } else {
    subTabs.style.display = "none";
  }

  $("#v").innerHTML = [vSch, vBud, vChk, vRes, vOutfit][tab]();

  if (tab === 0) {
    attachMapEvents();
  }
}

// 로컬 스토리지 캐시 확인
try {
  const L = localStorage.getItem("guam_trip_cloud_v1");
  if (L) {
    const parsed = JSON.parse(L);
    if (parsed && Array.isArray(parsed.days)) {
      S = parsed;
      if (!S.personal) S.personal = [];
      if (!S.outfits) S.outfits = defaultS.outfits;
      if (!S.chk) S.chk = [];
    }
  }
} catch (e) {}

fitCurrentRoute();
render();
initRealtimeSync();
</script>
