async function autoFindCoords(dIdx, sIdx, name) {
  if (!name || !name.trim()) return;
  const clean = name.trim().toLowerCase().replace(/[^a-z0-9가-힣]/g, "");

  for (const [k, c] of Object.entries(GUAM_GEO)) {
    if (clean.includes(k)) {
      if (S.days[dIdx]?.s[sIdx]) {
        S.days[dIdx].s[sIdx].a = c[0];
        S.days[dIdx].s[sIdx].o = c[1];
        toast(`'${name}' 좌표 등록 완료`);
        up();
        return;
      }
    }
  }

  try {
    const q = encodeURIComponent(`${name} Guam`);
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`, {
      headers: { "Accept-Language": "ko,en" }
    });
    const data = await res.json();
    if (data && data.length > 0) {
      const lat = parseFloat(parseFloat(data[0].lat).toFixed(4));
      const lon = parseFloat(parseFloat(data[0].lon).toFixed(4));
      if (S.days[dIdx]?.s[sIdx]) {
        S.days[dIdx].s[sIdx].a = lat;
        S.days[dIdx].s[sIdx].o = lon;
        toast(`'${name}' 좌표 검색 완료: ${lat}, ${lon}`);
        up();
      }
    } else {
      toast(`'${name}' 좌표를 찾지 못했습니다.`);
    }
  } catch (e) {
    toast("좌표 검색 실패");
  }
}

function getGoogleMapsUrl(dayIndex) {
  const currentDay = S.days[dayIndex];
  if (!currentDay || !currentDay.s) return "";

  const validStops = currentDay.s.filter(s => (s.a !== "" && s.o !== "" && s.a != null) || (s.n && s.n.trim()));
  if (validStops.length < 2) return "";

  const formatStop = s => {
    if (s.a !== "" && s.o !== "" && s.a != null) return `${Number(s.a).toFixed(4)},${Number(s.o).toFixed(4)}`;
    return encodeURIComponent(s.n.trim() + " Guam");
  };

  const origin = formatStop(validStops[0]);
  const destination = formatStop(validStops[validStops.length - 1]);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;

  if (validStops.length > 2) {
    const waypoints = validStops.slice(1, -1).map(formatStop).join("|");
    url += `&waypoints=${waypoints}`;
  }
  return url;
}

// 괌 SVG 동선 지도 컴포넌트 (정밀 정사영 투영 및 왜곡 방지)
function vMap() {
  const d = S.days[day];
  const P = d.s.filter(s => 
    s.a !== "" && s.o !== "" && s.a != null &&
    s.a >= 13.1 && s.a <= 13.8 && s.o >= 144.5 && s.o <= 145.1
  );

  const gmapsLink = getGoogleMapsUrl(day);

  const W = 420, H = 510;
  // 괌 중심 위도(13.45도) 기준 경도 수축 보정 계수
  const k = Math.cos(13.45 * Math.PI / 180); // 약 0.9725

  // 전체 지도 바운딩 박스 (괌 전체 영역)
  let minLon = 144.590, maxLon = 144.985;
  let minLat = 13.220, maxLat = 13.670;

  if (zm && P.length) {
    const lons = P.map(p => p.o);
    const lats = P.map(p => p.a);
    const pMinLon = Math.min(...lons), pMaxLon = Math.max(...lons);
    const pMinLat = Math.min(...lats), pMaxLat = Math.max(...lats);

    // 일정 마커를 감싸는 넉넉한 패딩 추가
    const cLat = (pMinLat + pMaxLat) / 2;
    const cLon = (pMinLon + pMaxLon) / 2;
    const spanLat = Math.max(pMaxLat - pMinLat, 0.045) * 1.5;
    const spanLon = spanLat * (W / H) / k;

    minLat = cLat - spanLat / 2;
    maxLat = cLat + spanLat / 2;
    minLon = cLon - spanLon / 2;
    maxLon = cLon + spanLon / 2;
  }

  // 투영 변환 함수: (경도, 위도) -> SVG (x, y) 픽셀 좌표
  const project = (lon, lat) => {
    const x = ((lon - minLon) / (maxLon - minLon)) * W;
    const y = ((maxLat - lat) / (maxLat - minLat)) * H;
    return [x, y];
  };

  // 1. 섬 외곽선 다각형 생성
  const islandPoints = GU_DETAILED.map(pt => {
    const [x, y] = project(pt[0], pt[1]);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");

  // 2. 방문 일정 좌표 투영
  const markerCoords = P.map(p => project(p.o, p.a));

  const svg = `
    <svg class="map" style="max-width:440px;" viewBox="0 0 ${W} ${H}">
      <!-- 바다 배경 -->
      <rect width="${W}" height="${H}" fill="var(--sea)"/>
      
      <!-- 정밀 괌 본섬 육지 다각형 -->
      <polygon points="${islandPoints}" fill="var(--land)" stroke="var(--land-border)" stroke-width="2" stroke-linejoin="round"/>
      
      <!-- 경로 점선 (Polyline) -->
      ${markerCoords.length > 1 ? `
        <polyline points="${markerCoords.map(c => `${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ")}" 
          fill="none" stroke="var(--pin)" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
      ` : ""}
      
      <!-- 방문지 마커 & 라벨 -->
      ${markerCoords.map((c, i) => {
        const x = c[0], y = c[1];
        const isRight = x > W * 0.6;
        return `
          <g>
            <circle cx="${x}" cy="${y}" r="11" fill="var(--pin)" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
            <text x="${x}" y="${y + 4}" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">${i + 1}</text>
            <text x="${x + (isRight ? -16 : 16)}" y="${y + 4}" text-anchor="${isRight ? "end" : "start"}" 
              fill="var(--tx)" font-size="11.5" font-weight="700" paint-order="stroke" stroke="var(--cd)" stroke-width="3.5">${E(P[i].n)}</text>
          </g>
        `;
      }).join("")}
      
      <!-- 방위 표시 -->
      <g transform="translate(14, 24)">
        <text x="0" y="0" fill="var(--mu)" font-size="11" font-weight="700" letter-spacing="0.5">GUAM ISLAND N ↑</text>
      </g>
    </svg>
  `;

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px;">
      <h3 style="margin:0;font-size:16px;">🗺️ 이 날의 동선 지도 (${E(d.d)})</h3>
      <button class="chip ${zm ? "on" : ""}" style="font-size:12px;padding:4px 12px;" onclick="zm = zm ? 0 : 1; render();">
        🔍 ${zm ? "전체 보기" : "경로 확대"}
      </button>
    </div>

    ${svg}

    ${P.length === 0 ? `
      <div class="sm" style="margin-top:8px;text-align:center;padding:10px;background:var(--cd);border-radius:12px;border:1px solid var(--ln);">
        이 날은 등록된 장소가 없습니다. 일정을 추가하거나 위도/경도를 확인해주세요.
      </div>
    ` : `
      <div class="card" style="margin-top:10px;">
        <div style="font-size:13px;line-height:1.8;">
          ${P.map((p, i) => `
            <div><b>${i + 1}.</b> <span class="sm">${E(p.t || "--:--")}</span> <b>${E(p.n)}</b> ${p.m ? `<span class="sm">(${E(p.m)})</span>` : ""} <span class="sm" style="color:var(--mu)">[${Number(p.a).toFixed(4)}, ${Number(p.o).toFixed(4)}]</span></div>
          `).join("")}
        </div>
      </div>
    `}

    <div style="margin-top:10px;">
      ${gmapsLink ? `
        <a class="btn" style="width:100%" target="_blank" rel="noopener noreferrer" href="${gmapsLink}">
          구글맵에서 이 날 전체 경로 열기 ↗
        </a>
      ` : `
        <div class="sm" style="text-align:center;color:var(--mu);margin-top:6px;">
          장소가 2곳 이상이면 구글맵 경로 열기 링크가 활성화됩니다.
        </div>
      `}
    </div>
  `;
}

// 1. 일정 탭
function vSch() {
  const curDay = S.days[day];
  return `
    <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;">
      ${S.days.map((d, i) => `
        <button class="chip ${i === day ? "on" : ""}" onclick="day = ${i}; render();">${E(d.d)}</button>
      `).join("")}
    </div>

    <div class="card">
      ${curDay.s.map((s, j) => `
        <div style="border-bottom:1px solid var(--ln);padding:10px 0;">
          <div class="row st">
            <input value="${E(s.t)}" placeholder="10:00" onchange="up(() => S.days[${day}].s[${j}].t = this.value)">
            <input value="${E(s.n)}" placeholder="장소명 입력시 좌표 자동검색" style="font-weight:600" 
              onchange="const val = this.value; up(() => S.days[${day}].s[${j}].n = val); if(!S.days[${day}].s[${j}].a) autoFindCoords(${day}, ${j}, val);">
            <button class="x" title="삭제" onclick="up(() => S.days[${day}].s.splice(${j}, 1))">×</button>
          </div>

          <div class="row" style="grid-template-columns:1fr 88px 96px auto;margin-top:6px;">
            <input value="${E(s.m)}" placeholder="메모" onchange="up(() => S.days[${day}].s[${j}].m = this.value)">
            <input class="coord-input" type="number" step="0.0001" value="${s.a !== '' && s.a != null ? Number(s.a).toFixed(4) : ''}" placeholder="위도 (13.xxxx)" onchange="up(() => S.days[${day}].s[${j}].a = this.value === '' ? '' : +this.value)">
            <input class="coord-input" type="number" step="0.0001" value="${s.o !== '' && s.o != null ? Number(s.o).toFixed(4) : ''}" placeholder="경도 (144.xxxx)" onchange="up(() => S.days[${day}].s[${j}].o = this.value === '' ? '' : +this.value)">
            <button class="geo-btn" title="장소명으로 좌표 다시 찾기" onclick="autoFindCoords(${day}, ${j}, S.days[${day}].s[${j}].n)">📍 자동</button>
          </div>
        </div>
      `).join("")}

      <button class="btn g" style="margin-top:12px;width:100%" onclick="up(() => S.days[${day}].s.push({ t: '', n: '', m: '', a: '', o: '' }))">
        + 새 일정 추가
      </button>
    </div>

    <div class="sm" style="margin-bottom:12px;">
      💡 괌 주요 명소(투몬, 공항, GPO, 피시아이 등)를 입력하면 좌표가 자동 채워집니다.
    </div>

    ${vMap()}
  `;
}

// 2. 예산 탭
function usd(b) {
  return b.c === "USD" ? +b.a : +b.a / S.rate;
}

function vBud() {
  const T = S.bud.reduce((s, b) => s + usd(b), 0);
  const cats = {};
  S.bud.forEach(b => cats[b.k] = (cats[b.k] || 0) + usd(b));
  const f = n => Math.round(n || 0).toLocaleString();

  return `
    <div class="card">
      <div class="sm">총 예산</div>
      <div class="tot">$${f(T)} <span class="sm">≈ ${f(T * S.rate)}원</span></div>
      <div style="margin-top:6px">1인당 <b>$${f(T / (S.pax || 1))}</b> (${f((T * S.rate) / (S.pax || 1))}원)</div>
      <div class="row" style="grid-template-columns:auto 90px auto 60px;margin-top:10px">
        <span class="sm">환율 1$ =</span>
        <input type="number" value="${S.rate}" onchange="up(() => S.rate = +this.value || 1400)">
        <span class="sm">원 · 인원</span>
        <input type="number" min="1" value="${S.pax}" onchange="up(() => S.pax = +this.value || 1)">
      </div>
    </div>

    <div class="card ov">
      <table>
        ${S.bud.map((b, i) => `
          <tr>
            <td><input style="width:100%" value="${E(b.n)}" onchange="up(() => S.bud[${i}].n = this.value)"></td>
            <td><input type="number" style="width:85px" value="${b.a || ""}" placeholder="0" onchange="up(() => S.bud[${i}].a = +this.value)"></td>
            <td>
              <select onchange="up(() => S.bud[${i}].c = this.value)">
                <option ${b.c === "USD" ? "selected" : ""}>USD</option>
                <option ${b.c === "KRW" ? "selected" : ""}>KRW</option>
              </select>
            </td>
            <td><input style="width:75px" value="${E(b.k)}" onchange="up(() => S.bud[${i}].k = this.value)"></td>
            <td><button class="x" onclick="up(() => S.bud.splice(${i}, 1))">×</button></td>
          </tr>
        `).join("")}
      </table>
      <button class="btn g" style="margin-top:8px;width:100%" onclick="up(() => S.bud.push({ n: '', a: 0, c: 'USD', k: '기타' }))">+ 항목 추가</button>
    </div>

    <div class="card">
      ${Object.entries(cats).map(([k, v]) => `
        <div class="sm" style="display:flex;justify-content:space-between;margin-bottom:2px;">
          <span>${E(k)}</span>
          <span>$${f(v)}</span>
        </div>
        <div class="bar" style="margin-bottom:8px;"><i style="width:${T ? (v / T) * 100 : 0}%"></i></div>
      `).join("")}
    </div>
  `;
}

// 3. 준비물 탭
function vChk() {
  let a = 0, n = 0;
  S.chk.forEach(g => g.i.forEach(i => { n++; a += i[1]; }));

  return `
    <div class="card">
      <b>준비 진행률 ${a}/${n}</b>
      <div class="bar" style="margin-top:6px;"><i style="width:${n ? (a / n) * 100 : 0}%"></i></div>
    </div>

    ${S.chk.map((g, gi) => `
      <div class="card">
        <b>${E(g.g)}</b>
        ${g.i.map((it, ii) => `
          <div style="display:flex;gap:8px;align-items:center;padding:5px 0;">
            <input type="checkbox" ${it[1] ? "checked" : ""} onchange="up(() => S.chk[${gi}].i[${ii}][1] = this.checked ? 1 : 0)">
            <span style="flex:1;${it[1] ? "text-decoration:line-through;color:var(--mu)" : ""}">${E(it[0])}</span>
            <button class="x" onclick="up(() => S.chk[${gi}].i.splice(${ii}, 1))">×</button>
          </div>
        `).join("")}
        <input placeholder="+ 새 준비물 입력 후 Enter" style="width:100%;margin-top:6px" 
          onkeydown="if(event.key === 'Enter' && this.value.trim()){ const val = this.value.trim(); up(() => S.chk[${gi}].i.push([val, 0])); this.value = ''; }">
      </div>
    `).join("")}
  `;
}

// 4. 예약 탭
function vRes() {
  return `
    <div class="card ov">
      <table>
        ${S.res.map((r, i) => `
          <tr>
            <td colspan="2" style="border-bottom:1px solid var(--ln);padding:8px 0;">
              <div class="row" style="grid-template-columns:75px 1fr 1fr 28px">
                <input value="${E(r.k)}" onchange="up(() => S.res[${i}].k = this.value)">
                <input value="${E(r.n)}" placeholder="이름·구간" onchange="up(() => S.res[${i}].n = this.value)">
                <input value="${E(r.w)}" placeholder="날짜·시간" onchange="up(() => S.res[${i}].w = this.value)">
                <button class="x" onclick="up(() => S.res.splice(${i}, 1))">×</button>
              </div>
              <div class="row" style="grid-template-columns:1fr 1fr;margin-top:5px">
                <input value="${E(r.no)}" placeholder="확인번호" onchange="up(() => S.res[${i}].no = this.value)">
                <input value="${E(r.m)}" placeholder="메모" onchange="up(() => S.res[${i}].m = this.value)">
              </div>
            </td>
          </tr>
        `).join("")}
      </table>
      <button class="btn g" style="margin-top:10px;width:100%" onclick="up(() => S.res.push({ k: '', n: '', w: '', no: '', m: '' }))">+ 예약 항목 추가</button>
    </div>
  `;
}

function render() {
  $("#nav").innerHTML = TABS.map((t, i) => `
    <button class="${i === tab ? "on" : ""}" onclick="tab = ${i}; render();">${t}</button>
  `).join("");
  $("#v").innerHTML = [vSch, vBud, vChk, vRes][tab]();
}

// 수정한 현재 데이터를 기본값(S)으로 치환하여 새 index.html 파일 다운로드
function exportHtml() {
  let doc = document.documentElement.outerHTML;
  const regex = /let S\s*=\s*\{[\s\S]*?\n\};/;
  const updatedS = "let S = " + JSON.stringify(S, null, 2) + ";";
  doc = doc.replace(regex, updatedS);

  const blob = new Blob([doc], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  toast("index.html 다운로드 완료!");
}

// 저장된 데이터 로드 (캐시 우선 복구 및 구조 호환성 유지)
try {
  const L = localStorage.getItem("guam_trip_v2");
  if (L) {
    const parsed = JSON.parse(L);
    if (parsed && parsed.days) S = parsed;
  }
} catch (e) {}

render();
</script>
